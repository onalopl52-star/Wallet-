<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wallet Prototype</title>

<style>
:root{
  --bg:#080a0d;
  --panel:#14181f;
  --panel2:#1a2028;
  --line:#29313b;
  --text:#f7f8fa;
  --muted:#929aa6;
  --accent:#f0b90b;
  --green:#20c997;
  --red:#ff667d;
  --blue:#3b82f6;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  max-width:760px;
  margin:auto;
  min-height:100vh;
  padding-bottom:90px;
}

/* HEADER */

.header{
  position:sticky;
  top:0;
  z-index:20;
  background:#111318;
  border-bottom:1px solid var(--line);
  padding:18px 18px 12px;
}

.header-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:22px;
  font-weight:800;
}

.logo-icon{
  width:36px;
  height:36px;
  border-radius:12px;
  background:var(--accent);
  color:#111;
  display:grid;
  place-items:center;
  font-weight:900;
}

.header-actions{
  display:flex;
  gap:8px;
}

.icon-btn{
  border:0;
  background:#20252d;
  color:white;
  width:42px;
  height:42px;
  border-radius:50%;
  font-size:18px;
}

.ticker{
  margin-top:14px;
  overflow:hidden;
  white-space:nowrap;
  color:var(--muted);
}

.ticker span{
  margin-right:28px;
}

.up{
  color:var(--green);
}

.down{
  color:var(--red);
}

/* CONTENT */

.content{
  padding:20px;
}

.page-title{
  font-size:30px;
  margin:4px 0 18px;
}

.demo-label{
  display:inline-block;
  background:#3a2d08;
  color:#ffd84d;
  padding:7px 11px;
  border-radius:8px;
  font-size:12px;
  margin-bottom:14px;
}

/* BALANCE */

.balance-card{
  background:linear-gradient(145deg,#181e25,#202731);
  border:1px solid #a77e00;
  border-radius:20px;
  padding:24px;
  margin-bottom:18px;
}

.balance-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
}

.balance-label{
  color:var(--muted);
  font-size:15px;
}

.balance{
  font-size:42px;
  font-weight:800;
  margin:12px 0;
  word-break:break-word;
}

.balance-hidden{
  letter-spacing:5px;
}

.balance-sub{
  color:var(--muted);
}

.stats{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  margin-top:24px;
}

.stat{
  background:#151a21;
  border-radius:13px;
  padding:15px;
}

.stat small{
  color:var(--muted);
  display:block;
  margin-bottom:6px;
}

.stat strong{
  font-size:17px;
}

/* ACTIONS */

.actions{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-bottom:18px;
}

.action{
  border:1px solid var(--line);
  background:var(--panel);
  color:white;
  border-radius:14px;
  padding:15px 8px;
  font-weight:700;
}

.action:hover{
  border-color:var(--accent);
}

/* ASSETS */

.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:18px;
  padding:20px;
  margin-bottom:18px;
}

.card-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}

.card-title h2{
  margin:0;
  font-size:20px;
}

.asset{
  width:100%;
  border:0;
  border-top:1px solid var(--line);
  background:transparent;
  color:white;
  text-align:left;
  padding:17px 0;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.asset:first-of-type{
  border-top:0;
}

.asset-left{
  display:flex;
  align-items:center;
  gap:12px;
}

.coin{
  width:44px;
  height:44px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:#302719;
  color:#f0b90b;
  font-weight:900;
}

.asset-name{
  font-weight:700;
}

.asset-amount{
  color:var(--muted);
  font-size:13px;
  margin-top:4px;
}

.asset-price{
  text-align:right;
  font-weight:700;
}

/* TRANSACTIONS */

.empty{
  text-align:center;
  padding:25px 10px;
  color:var(--muted);
}

/* BOTTOM NAV */

.bottom-nav{
  position:fixed;
  left:50%;
  bottom:0;
  transform:translateX(-50%);
  width:min(760px,100%);
  background:#111318;
  border-top:1px solid var(--line);
  display:grid;
  grid-template-columns:repeat(4,1fr);
  padding:10px;
  z-index:30;
}

.nav-btn{
  border:0;
  background:transparent;
  color:var(--muted);
  padding:8px 3px;
  border-radius:10px;
}

.nav-btn.active{
  color:var(--accent);
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.72);
  display:none;
  align-items:flex-end;
  justify-content:center;
  z-index:100;
}

.modal.show{
  display:flex;
}

.sheet{
  width:min(760px,100%);
  background:#171c23;
  border-radius:24px 24px 0 0;
  border:1px solid var(--line);
  padding:22px;
  max-height:90vh;
  overflow:auto;
}

.sheet-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.sheet-head h2{
  margin:0;
}

.close{
  border:0;
  background:#292f38;
  color:white;
  width:38px;
  height:38px;
  border-radius:50%;
}

.field{
  margin:15px 0;
}

.field label{
  display:block;
  color:var(--muted);
  font-size:13px;
  margin-bottom:7px;
}

.field input{
  width:100%;
  background:#0f1318;
  border:1px solid var(--line);
  color:white;
  padding:14px;
  border-radius:12px;
  outline:none;
}

.primary{
  width:100%;
  border:0;
  background:var(--accent);
  color:#111;
  padding:15px;
  border-radius:12px;
  font-weight:800;
  margin-top:8px;
}

.secondary{
  width:100%;
  border:1px solid var(--line);
  background:#20252d;
  color:white;
  padding:14px;
  border-radius:12px;
  font-weight:700;
  margin-top:10px;
}

.notice{
  background:#20252d;
  border-left:4px solid var(--accent);
  padding:14px;
  border-radius:8px;
  color:#d9dde3;
  line-height:1.5;
}

.profile{
  display:flex;
  align-items:center;
  gap:15px;
  background:#20252d;
  padding:16px;
  border-radius:15px;
}

.avatar{
  width:54px;
  height:54px;
  border-radius:50%;
  background:var(--accent);
  color:#111;
  display:grid;
  place-items:center;
  font-weight:900;
  font-size:20px;
}

.profile strong{
  display:block;
  font-size:18px;
}

.profile span{
  color:var(--muted);
  font-size:13px;
}

.setting{
  width:100%;
  border:0;
  border-bottom:1px solid var(--line);
  background:transparent;
  color:white;
  padding:18px 4px;
  text-align:left;
  display:flex;
  justify-content:space-between;
}

/* TOAST */

.toast{
  position:fixed;
  left:50%;
  bottom:85px;
  transform:translateX(-50%) translateY(20px);
  background:#252b33;
  border:1px solid var(--line);
  color:white;
  padding:13px 18px;
  border-radius:12px;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  z-index:200;
  max-width:90%;
  text-align:center;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* MOBILE */

@media(max-width:500px){
  .content{
    padding:15px;
  }

  .balance{
    font-size:34px;
  }

  .stats{
    grid-template-columns:1fr 1fr;
  }

  .actions{
    grid-template-columns:1fr 1fr 1fr;
  }
}
</style>
</head>

<body>

<div class="app">

<header class="header">
  <div class="header-row">

    <div class="logo">
      <div class="logo-icon">W</div>
      <span>My Wallet</span>
    </div>

    <div class="header-actions">
      <button class="icon-btn" onclick="openModal('notifications')">🔔</button>
      <button class="icon-btn" onclick="openModal('profile')">👤</button>
    </div>

  </div>

  <div class="ticker">
    <span>BTC/USDT <b id="btcTicker">Loading...</b></span>
    <span>ETH/USDT <b id="ethTicker">Loading...</b></span>
    <span>SOL/USDT <b id="solTicker">Loading...</b></span>
  </div>
</header>


<main class="content">

  <span class="demo-label">WALLET PROTOTYPE</span>

  <h1 class="page-title">Portfolio Overview</h1>

  <section class="balance-card">

    <div class="balance-top">
      <div>
        <div class="balance-label">Total Portfolio Value</div>

        <div
          class="balance"
          id="balance"
          onclick="toggleBalance()"
        >
          $263,753.10
        </div>

        <div class="balance-sub">
          Click the balance to hide/show
        </div>
      </div>

      <button
        class="icon-btn"
        onclick="toggleBalance()"
        title="Hide or show balance"
      >
        👁
      </button>
    </div>

    <div class="stats">

      <div class="stat">
        <small>Available Balance</small>
        <strong>$263,753.10</strong>
      </div>

      <div class="stat">
        <small>24h Change</small>
        <strong class="up">+3.21%</strong>
      </div>

    </div>

  </section>


  <section class="actions">

    <button class="action" onclick="openModal('deposit')">
      ↓ Deposit
    </button>

    <button class="action" onclick="openModal('withdraw')">
      ↑ Withdraw
    </button>

    <button class="action" onclick="openModal('refund')">
      ↻ Refund
    </button>

  </section>


  <section class="card">

    <div class="card-title">
      <h2>Your Assets</h2>
      <button
        class="action"
        style="padding:9px 12px"
        onclick="openModal('deposit')"
      >
        Deposit
      </button>
    </div>


    <button class="asset" onclick="assetInfo('Bitcoin')">

      <div class="asset-left">
        <div class="coin">₿</div>

        <div>
          <div class="asset-name">Bitcoin</div>
          <div class="asset-amount">3.00000000 BTC</div>
        </div>
      </div>

      <div class="asset-price">
        <div id="btcPrice">$—</div>
        <div class="asset-amount">BTC/USDT</div>
      </div>

    </button>


    <button class="asset" onclick="assetInfo('Ethereum')">

      <div class="asset-left">
        <div class="coin">Ξ</div>

        <div>
          <div class="asset-name">Ethereum</div>
          <div class="asset-amount">10.00000000 ETH</div>
        </div>
      </div>

      <div class="asset-price">
        <div id="ethPrice">$—</div>
        <div class="asset-amount">ETH/USDT</div>
      </div>

    </button>


    <button class="asset" onclick="assetInfo('Solana')">

      <div class="asset-left">
        <div class="coin">S</div>

        <div>
          <div class="asset-name">Solana</div>
          <div class="asset-amount">76.00000000 SOL</div>
        </div>
      </div>

      <div class="asset-price">
        <div id="solPrice">$—</div>
        <div class="asset-amount">SOL/USDT</div>
      </div>

    </button>

  </section>


  <section class="card">

    <div class="card-title">
      <h2>Transaction History</h2>
    </div>

    <div class="empty">
      No transactions yet.
    </div>

  </section>

</main>


<nav class="bottom-nav">

  <button class="nav-btn active" onclick="goHome()">
    🏠<br>Home
  </button>

  <button class="nav-btn" onclick="openModal('assets')">
    💰<br>Assets
  </button>

  <button class="nav-btn" onclick="openModal('history')">
    📋<br>History
  </button>

  <button class="nav-btn" onclick="openModal('profile')">
    👤<br>Profile
  </button>

</nav>

</div>


<!-- MODAL -->

<div class="modal" id="modal">

  <div class="sheet">

    <div class="sheet-head">
      <h2 id="modalTitle">Wallet</h2>
      <button class="close" onclick="closeModal()">✕</button>
    </div>

    <div id="modalContent"></div>

  </div>

</div>


<div class="toast" id="toast"></div>


<script>

/* ------------------------------
   BALANCE VISIBILITY
-------------------------------- */

let balanceVisible = true;

function toggleBalance(){

  const balance = document.getElementById("balance");

  balanceVisible = !balanceVisible;

  if(balanceVisible){

    balance.textContent = "$263,753.10";
    balance.classList.remove("balance-hidden");

  }else{

    balance.textContent = "••••••••";
    balance.classList.add("balance-hidden");

  }
}


/* ------------------------------
   MODAL SYSTEM
-------------------------------- */

function openModal(type){

  const modal = document.getElementById("modal");
  const title = document.getElementById("modalTitle");
  const content = document.getElementById("modalContent");

  modal.classList.add("show");


  if(type === "withdraw"){

    title.textContent = "Withdraw";

    content.innerHTML = `

      <div class="notice">
        Withdrawal is currently a prototype flow and is not connected
        to a live financial service.
      </div>

      <div class="field">
        <label>Destination wallet address</label>
        <input
          id="withdrawAddress"
          placeholder="Paste your wallet address"
        >
      </div>

      <div class="field">
        <label>Network</label>
        <input
          id="withdrawNetwork"
          placeholder="Example: Bitcoin, Ethereum, Solana"
        >
      </div>

      <div class="field">
        <label>Amount</label>
        <input
          id="withdrawAmount"
          type="number"
          placeholder="Enter amount"
        >
      </div>

      <button class="primary" onclick="submitWithdraw()">
        Review Withdrawal
      </button>

      <button class="secondary" onclick="closeModal()">
        Cancel
      </button>
    `;

  }


  else if(type === "refund"){

    title.textContent = "Refund";

    content.innerHTML = `

      <div class="notice">
        Refund status is displayed for demonstration purposes only.
        This prototype does not process or confirm real payments.
      </div>

      <br>

      <div class="stat">
        <small>Refund status</small>
        <strong>Not processed</strong>
      </div>

      <br>

      <button class="primary" onclick="showToast('Refund feature is a prototype.')">
        View Refund Information
      </button>
    `;

  }


  else if(type === "deposit"){

    title.textContent = "Deposit";

    content.innerHTML = `

      <div class="notice">
        Use a compatible wallet address when testing a real wallet
        integration. This prototype does not receive cryptocurrency.
      </div>

      <div class="field">
        <label>Wallet address</label>
        <input
          readonly
          value="Demo wallet address"
          onclick="this.select()"
        >
      </div>

      <button
        class="primary"
        onclick="copyDemoAddress()"
      >
        Copy Address
      </button>
    `;

  }


  else if(type === "profile"){

    title.textContent = "Profile";

    content.innerHTML = `

      <div class="profile">

        <div class="avatar">GW</div>

        <div>
          <strong>Wallet User</strong>
          <span>Account profile</span>
        </div>

      </div>

      <br>

      <button class="setting" onclick="openModal('settings')">
        <span>⚙ Settings</span>
        <span>›</span>
      </button>

      <button class="setting" onclick="showToast('Security settings opened.')">
        <span>🔐 Security</span>
        <span>›</span>
      </button>

      <button class="setting" onclick="showToast('Notifications opened.')">
        <span>🔔 Notifications</span>
        <span>›</span>
      </button>

      <button class="setting" onclick="showToast('Support opened.')">
        <span>💬 Support</span>
        <span>›</span>
      </button>
    `;

  }


  else if(type === "settings"){

    title.textContent = "Settings";

    content.innerHTML = `

      <div class="field">
        <label>Email</label>
        <input
          readonly
          value="demo@example.com"
        >
      </div>

      <div class="field">
        <label>Account ID</label>
        <input
          readonly
          value="DEMO-756371252"
        >
      </div>

      <button class="setting" onclick="showToast('Security settings opened.')">
        <span>🔐 Security</span>
        <span>›</span>
      </button>

      <button class="setting" onclick="showToast('Appearance settings opened.')">
        <span>🎨 Appearance</span>
        <span>›</span>
      </button>

      <button class="setting" onclick="showToast('Language settings opened.')">
        <span>🌐 Language</span>
        <span>›</span>
      </button>

      <button class="setting" onclick="showToast('Help center opened.')">
        <span>❓ Help Center</span>
        <span>›</span>
      </button>
    `;

  }


  else if(type === "assets"){

    title.textContent = "Assets";

    content.innerHTML = `

      <div class="notice">
        Your assets are displayed as prototype data.
      </div>

      <br>

      <button class="setting" onclick="assetInfo('Bitcoin')">
        <span>₿ Bitcoin</span>
        <span>›</span>
      </button>

      <button class="setting" onclick="assetInfo('Ethereum')">
        <span>Ξ Ethereum</span>
        <span>›</span>
      </button>

      <button class="setting" onclick="assetInfo('Solana')">
        <span>S Solana</span>
        <span>›</span>
      </button>
    `;

  }


  else if(type === "history"){

    title.textContent = "Transaction History";

    content.innerHTML = `

      <div class="empty">
        <div style="font-size:40px">📋</div>
        <h3>No transactions yet</h3>
        <p>Your transaction history will appear here.</p>
      </div>
    `;

  }


  else if(type === "notifications"){

    title.textContent = "Notifications";

    content.innerHTML = `

      <div class="empty">
        <div style="font-size:40px">🔔</div>
        <h3>No new notifications</h3>
        <p>You're all caught up.</p>
      </div>
    `;

  }

}


function closeModal(){

  document.getElementById("modal").classList.remove("show");

}


/* ------------------------------
   WITHDRAWAL PROTOTYPE
-------------------------------- */

function submitWithdraw(){

  const address =
    document.getElementById("withdrawAddress").value.trim();

  const network =
    document.getElementById("withdrawNetwork").value.trim();

  const amount =
    document.getElementById("withdrawAmount").value.trim();


  if(!address || !network || !amount){

    showToast("Please complete all withdrawal fields.");

    return;
  }


  document.getElementById("modalTitle").textContent =
    "Review Withdrawal";

  document.getElementById("modalContent").innerHTML = `

    <div class="notice">
      Please review the information below before continuing.
      This is a prototype and does not submit a real transaction.
    </div>

    <br>

    <div class="stat">
      <small>Destination</small>
      <strong style="word-break:break-all">
        ${escapeHTML(address)}
      </strong>
    </div>

    <br>

    <div class="stat">
      <small>Network</small>
      <strong>${escapeHTML(network)}</strong>
    </div>

    <br>

    <div class="stat">
      <small>Amount</small>
      <strong>${escapeHTML(amount)}</strong>
    </div>

    <button
      class="primary"
      onclick="showToast('Prototype only — no transaction was submitted.')"
    >
      Confirm Demo
    </button>

    <button
      class="secondary"
      onclick="openModal('withdraw')"
    >
      Edit
    </button>
  `;
}


/* ------------------------------
   LIVE MARKET DATA
-------------------------------- */

async function loadPrices(){

  try{

    const response = await fetch(
      "https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,solana&vs_currencies=usd"
    );

    const data = await response.json();

    const btc =
      data.bitcoin.usd;

    const eth =
      data.ethereum.usd;

    const sol =
      data.solana.usd;


    document.getElementById("btcPrice").textContent =
      "$" + btc.toLocaleString();

    document.getElementById("ethPrice").textContent =
      "$" + eth.toLocaleString();

    document.getElementById("solPrice").textContent =
      "$" + sol.toLocaleString();


    document.getElementById("btcTicker").textContent =
      "$" + btc.toLocaleString();

    document.getElementById("ethTicker").textContent =
      "$" + eth.toLocaleString();

    document.getElementById("solTicker").textContent =
      "$" + sol.toLocaleString();

  }catch(error){

    document.getElementById("btcTicker").textContent =
      "Unavailable";

    document.getElementById("ethTicker").textContent =
      "Unavailable";

    document.getElementById("solTicker").textContent =
      "Unavailable";

  }
}


/* Refresh market prices periodically */

loadPrices();

setInterval(loadPrices,30000);


/* ------------------------------
   ASSET INFORMATION
-------------------------------- */

function assetInfo(name){

  showToast(name + " selected.");

}


/* ------------------------------
   DEMO ADDRESS
-------------------------------- */

function copyDemoAddress(){

  navigator.clipboard.writeText(
    "DEMO-WALLET-ADDRESS"
  );

  showToast("Demo address copied.");

}


/* ------------------------------
   HOME
-------------------------------- */

function goHome(){

  closeModal();

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* ------------------------------
   TOAST
-------------------------------- */

function showToast(message){

  const toast =
    document.getElementById("toast");

  toast.textContent = message;

  toast.classList.add("show");

  setTimeout(()=>{
    toast.classList.remove("show");
  },2500);

}


/* ------------------------------
   SECURITY
-------------------------------- */

function escapeHTML(value){

  const div =
    document.createElement("div");

  div.textContent = value;

  return div.innerHTML;

}


/* Close modal when clicking outside */

document.getElementById("modal")
.addEventListener("click",function(event){

  if(event.target === this){

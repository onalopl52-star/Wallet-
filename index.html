<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wallet Login</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #0b0e11;
    color: #f5f5f5;
    font-family: Arial, Helvetica, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.login-card {
    width: 100%;
    max-width: 420px;
    background: #181c21;
    border: 1px solid #30353d;
    border-radius: 20px;
    padding: 32px 25px;
    box-shadow: 0 20px 50px rgba(0,0,0,.35);
}

.logo {
    text-align: center;
    margin-bottom: 30px;
}

.logo-icon {
    width: 58px;
    height: 58px;
    border-radius: 50%;
    background: #f0b90b;
    color: #111;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: auto;
    font-size: 25px;
    font-weight: bold;
}

.logo h1 {
    margin: 14px 0 5px;
    font-size: 25px;
}

.logo p {
    margin: 0;
    color: #9299a6;
    font-size: 14px;
}

label {
    display: block;
    margin: 18px 0 8px;
    color: #c5cad2;
    font-size: 14px;
}

input {
    width: 100%;
    padding: 15px;
    border-radius: 10px;
    border: 1px solid #3a4048;
    background: #101318;
    color: white;
    font-size: 15px;
    outline: none;
}

input:focus {
    border-color: #f0b90b;
}

button {
    width: 100%;
    margin-top: 25px;
    padding: 15px;
    border: 0;
    border-radius: 10px;
    background: #f0b90b;
    color: #111;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #ffc928;
}

.error {
    display: none;
    margin-top: 15px;
    padding: 12px;
    border-radius: 9px;
    background: #351b1b;
    color: #ff7777;
    font-size: 14px;
}

.demo-note {
    margin-top: 20px;
    padding: 12px;
    border-radius: 10px;
    background: #20252c;
    color: #9299a6;
    font-size: 12px;
    line-height: 1.5;
    text-align: center;
}
</style>
</head>

<body>

<div class="login-card">

    <div class="logo">
        <div class="logo-icon">W</div>
        <h1>Wallet</h1>
        <p>Secure account access</p>
    </div>

    <form id="loginForm">

        <label for="email">Email address</label>
        <input
            id="email"
            type="email"
            placeholder="Enter your email"
            autocomplete="username"
            required
        >

        <label for="password">Password</label>
        <input
            id="password"
            type="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
        >

        <button type="submit">Sign in</button>

        <div id="error" class="error">
            Incorrect demo credentials.
        </div>

    </form>

    <div class="demo-note">
        Front-end demonstration only. No real financial credentials
        or funds are processed by this page.
    </div>

</div>

<script>
const DEMO_EMAIL = "demo@example.com";
const DEMO_PASSWORD = "DemoPass123!";

document.getElementById("loginForm").addEventListener("submit", function(event) {
    event.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    if (email === DEMO_EMAIL && password === DEMO_PASSWORD) {

        sessionStorage.setItem("demoWalletLoggedIn", "true");

        // Change this to the page containing your existing wallet UI.
        window.location.href = "index.html";

    } else {
        document.getElementById("error").style.display = "block";
    }
});
</script>

</body>
</html>
